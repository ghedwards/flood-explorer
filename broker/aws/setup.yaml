AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Flood Explorer live data broker: one-time setup. Lets the repository's
  GitHub Actions deploy the broker to Lambda through GitHub's OpenID Connect
  sign-in (no stored keys), and gives the function its own minimal role.
  The function itself is created and updated by .github/workflows/broker-deploy.yml.

Parameters:
  GitHubRepo:
    Type: String
    Default: ghedwards/flood-explorer
    Description: owner/name of the repository allowed to deploy
  FunctionName:
    Type: String
    Default: flood-broker
  CreateGitHubOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      "false" if this account already has the token.actions.githubusercontent.com
      identity provider (IAM > Identity providers); only one may exist.

  # memory for the function: 128 MB is too small for a refresh that now
  # fetches seven road feeds on top of Water Data Online and the Bureau;
  # 256 MB keeps the cost near zero (~$0.00) while leaving headroom
  MemorySize:
    Type: Number
    Default: 256
    AllowedValues: [128, 256, 512]
    Description: >-
      Lambda memory (MB). 128 MB OOM-killed the refresh once the per-state
      road feeds were added; 256 MB is the smallest size that fits.

  RefreshMinutes:
    Type: Number
    Default: 15
    AllowedValues: [15, 30, 60]
    Description: >-
      How often the readings are refreshed. Most gauges report hourly, so 30
      halves the refresh cost for at most 15 more minutes' delay. Set the
      repository variable BROKER_REFRESH_MINUTES to the same value.
  BudgetEmail:
    Type: String
    Default: ""
    Description: >-
      An address to email if this account's AWS spend for the month heads
      past MonthlyBudgetUsd (AWS Budgets, free). Leave empty for no alert.
  MonthlyBudgetUsd:
    Type: Number
    Default: 5
    Description: the monthly spend (US dollars) the alert watches

Conditions:
  MakeOidc: !Equals [!Ref CreateGitHubOidcProvider, "true"]
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, ""]]

Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # the shared readings file, refreshed by the schedule below
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${FunctionName}-data-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }

  # what the function runs as: its own logs and the readings file
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${FunctionName}-exec"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: readings-file
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${DataBucket.Arn}/readings*"   # readings.json, readings.json.gz, readings-history.json.gz
              - Effect: Allow
                Action: s3:ListBucket   # so a missing file is a 404, not a 403
                Resource: !GetAtt DataBucket.Arn

  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FunctionName}"
      RetentionInDays: 30

  # every 15 minutes: refresh the readings (Bureau of Meteorology and
  # Queensland), so the site build no longer has to
  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-flood-broker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}"
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}:*"

  RefreshSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${FunctionName}-refresh-readings"
      Description: Refresh Flood Explorer's river and dam readings
      ScheduleExpression: !Sub "rate(${RefreshMinutes} minutes)"
      FlexibleTimeWindow: { Mode: "OFF" }
      State: ENABLED
      Target:
        Arn: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}"
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"flood_broker": "refresh"}'
        RetryPolicy: { MaximumRetryAttempts: 3, MaximumEventAgeInSeconds: 900 }

  # an email if the month's spend heads past the budget (the whole account)
  SpendAlert:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !Sub "${FunctionName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]

  # what GitHub Actions on the main branch may do: manage this one function
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${FunctionName}-github-deploy"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # the main branch only; GitHub names the repository either as
              # owner/repo or, with immutable IDs, owner@123/repo@456
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubRepo}:ref:refs/heads/main"
                  - !Sub
                    - "repo:${Owner}@*/${Name}@*:ref:refs/heads/main"
                    - Owner: !Select [0, !Split ["/", !Ref GitHubRepo]]
                      Name: !Select [1, !Split ["/", !Ref GitHubRepo]]
      Policies:
        - PolicyName: deploy-flood-broker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunctionUrlConfig
                  - lambda:CreateFunctionUrlConfig
                  - lambda:UpdateFunctionUrlConfig
                  - lambda:GetPolicy
                  - lambda:AddPermission
                  - lambda:PutFunctionConcurrency
                  - lambda:DeleteFunctionConcurrency
                  - lambda:TagResource
                  - lambda:InvokeFunction   # the first readings refresh after a deploy
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com

Outputs:
  DataBucket:
    Description: where the readings file lives (the deploy finds it by name)
    Value: !Ref DataBucket
  DeployRoleArn:
    Description: set as the repository variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  Region:
    Description: set as the repository variable AWS_REGION
    Value: !Ref AWS::Region
