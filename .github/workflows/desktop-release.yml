name: Desktop installers

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  assemble-preview:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 9e41c7c751d536ea5f8adc9eb3bebfab2c110adf
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: downloads
          run-id: 40177489644
          github-token: ${{ github.token }}
      - name: Collect only version 0.2.0 installers
        shell: bash
        run: |
          find downloads -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -print
          mkdir release-assets
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            test ! -e "release-assets/$name" || { echo "Duplicate installer: $name"; exit 1; }
            cp "$file" "release-assets/$name"
          done < <(find downloads -type f \( -name '*_0.2.0_*.dmg' -o -name '*_0.2.0_*.exe' -o -name '*_0.2.0_*.deb' -o -name '*_0.2.0_*.AppImage' \) -print0)
          ls -lh release-assets
          test "$(find release-assets -type f | wc -l)" -eq 5
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Create draft prerelease from verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > preview-notes.md <<'NOTES'
          Desktop preview of Flood Explorer 0.2.0.

          Download the installer for your computer: macOS Apple Silicon (aarch64.dmg), macOS Intel (x64.dmg), Windows 64-bit (x64-setup.exe), or Linux 64-bit (.deb / .AppImage).

          These preview installers are not signed with trusted platform certificates. macOS uses ad-hoc signing; Windows builds are unsigned. Your operating system may warn or block installation.

          Automatic updates are not configured in this preview. Download future installers manually.

          The app bundles the viewer, flood engine, broker and national gauge catalogue. Internet access is required for new terrain, live readings and external map layers. Optional API keys can be entered in Settings.

          Verify downloads using SHA256SUMS.txt. This is a screening model; do not use it for emergency or property decisions.
          NOTES
          if gh release view desktop-v0.2.0 --json isDraft,targetCommitish > release-state.json 2>/dev/null; then
            jq -e '.isDraft == true and .targetCommitish == "9e41c7c751d536ea5f8adc9eb3bebfab2c110adf"' release-state.json
          else
            gh release create desktop-v0.2.0 --target 9e41c7c751d536ea5f8adc9eb3bebfab2c110adf --draft --prerelease --title "Flood Explorer 0.2.0 (desktop preview)" --notes-file preview-notes.md
          fi
          gh release upload desktop-v0.2.0 release-assets/* --clobber
