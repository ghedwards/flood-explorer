name: Desktop installers

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Validate desktop version
        id: version
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const version = JSON.parse(fs.readFileSync('desktop/tauri.conf.json')).version;
          const cargo = fs.readFileSync('desktop/Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)[1];
          if (cargo !== version) throw new Error('Desktop Cargo and Tauri versions differ');
          const tag = `desktop-v${version}`;
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== tag)
            throw new Error(`Release tag must be ${tag}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          JS
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: desktop-data-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'rust/Cargo.lock', 'rust/**/*.rs') }}
          restore-keys: desktop-data-${{ runner.os }}-
      - run: npm ci
      - name: Check frontend and flood model
        run: |
          npm run build:wasm
          npm run lint
          npm test
          cargo test --locked --manifest-path rust/Cargo.toml -p flood-core -p flood-wasm -p flood-broker
      - name: Prepare national data for every installer
        run: |
          cargo build --locked --release --manifest-path rust/Cargo.toml -p flood-pipeline
          rust/target/release/flood national viewer/data/national
          rust/target/release/flood floodinfo viewer/data/national
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-data
          path: viewer/data/
          if-no-files-found: error
          retention-days: 7

  build:
    needs: data
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }} wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
            rust/target
          key: desktop-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', 'desktop/Cargo.lock', 'rust/Cargo.lock', 'desktop/**/*.rs', 'rust/**/*.rs') }}
          restore-keys: desktop-${{ matrix.target }}-
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: desktop-data
          path: viewer/data
      - name: Prepare Apple signing environment
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && (secrets.APPLE_SIGNING_IDENTITY || '-') || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const { randomUUID } = require('node:crypto');
          // Tauri treats present-but-empty variables as real credentials.
          // Export only configured values; an imported P12 may have an empty password.
          const names = ['APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD',
            'APPLE_SIGNING_IDENTITY', 'APPLE_ID', 'APPLE_PASSWORD', 'APPLE_TEAM_ID'];
          for (const name of names) {
            const value = process.env[name] || '';
            if (!value && !(name === 'APPLE_CERTIFICATE_PASSWORD' && process.env.APPLE_CERTIFICATE)) continue;
            const delimiter = randomUUID();
            fs.appendFileSync(process.env.GITHUB_ENV, `${name}<<${delimiter}\n${value}\n${delimiter}\n`);
          }
          JS
      - name: Build installers
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop
          tauriScript: npx --yes --package @tauri-apps/cli@2.12.4 tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            desktop/target/**/bundle/dmg/*.dmg
            desktop/target/**/bundle/nsis/*.exe
            desktop/target/**/bundle/deb/*.deb
            desktop/target/**/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: [data, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: downloads
      - name: Collect installers and checksums
        run: |
          mkdir release-assets
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            test ! -e "release-assets/$name" || { echo "Duplicate installer: $name"; exit 1; }
            cp "$file" "release-assets/$name"
          done < <(find downloads -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -print0)
          test "$(find release-assets -type f | wc -l)" -eq 5
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Create or update draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.data.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > release-state.json 2>/dev/null; then
            jq -e '.isDraft == true and .targetCommitish == env.GITHUB_SHA' release-state.json
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --prerelease \
              --title "Flood Explorer ${RELEASE_TAG#desktop-v} (desktop preview)" \
              --notes-file desktop/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
