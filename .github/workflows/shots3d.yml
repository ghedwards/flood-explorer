name: 3D view screenshots

# Screenshots of the 3D view (tests/shots3d.js) pushed to the shots-3d
# branch, for reviewing it without a browser at hand. Runs against the
# live site, or against this branch built here (to check a change before
# it deploys).
on:
  workflow_dispatch:
    inputs:
      target:
        description: "live, or build (this branch, built and served here)"
        default: live
      place:
        description: "Preset to model"
        default: rockhampton
  push:
    branches: ["3d-*"]

permissions:
  contents: write

concurrency:
  group: shots3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install browser tooling
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Build and serve this branch
        if: github.event_name == 'push' || inputs.target == 'build'
        run: |
          npm run build
          npm run preview -- --port 8000 --strictPort > preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat preview.log
          exit 1
      - name: Screenshots
        env:
          SITE_URL: ${{ (github.event_name == 'push' || inputs.target == 'build') && 'http://127.0.0.1:8000/' || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          PLACE: ${{ inputs.place || 'rockhampton' }}
          OUT: ${{ runner.temp }}/shots
        run: node tests/shots3d.js
      - name: Push to the shots-3d branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          cd "$RUNNER_TEMP/shots" || exit 0
          printf '%s\n' "From ${GITHUB_REF_NAME} at ${GITHUB_SHA::8} (${EVENT_NAME}), $(date -u +%FT%TZ)" > SOURCE.txt
          git init -q -b shots-3d
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "3D screenshots for ${GITHUB_REF_NAME} ${GITHUB_SHA::8}"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" push -qf "https://github.com/${GITHUB_REPOSITORY}.git" shots-3d
