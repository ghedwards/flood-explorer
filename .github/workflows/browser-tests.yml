name: Browser checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/**'
      - 'viewer/**'
      - 'scripts/**'
      - 'vite.config.mjs'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browser-tests.yml'
      - '.github/workflows/build.yml'
  workflow_call:
    inputs:
      site_url:
        type: string
        required: true
      presets:
        type: string
        default: quick
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Serve the pull request viewer with published data
        if: github.event_name == 'pull_request'
        timeout-minutes: 15
        run: |
          npm run build
          npm run test:build
          npm run preview -- --port 8000 --strictPort > preview.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat preview.log
          exit 1
      - name: Check the 5 m picture worker in the built bundle
        if: github.event_name == 'pull_request'
        timeout-minutes: 5
        run: node tests/fine-worker-browser.js
      - name: Check the impact panel, routes and flood over time in the built bundle
        if: github.event_name == 'pull_request'
        timeout-minutes: 5
        run: node tests/impact-browser.js
      - name: Check the live interactive map
        timeout-minutes: 25
        env:
          SITE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:8000/' || inputs.site_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          SMOKE_PRESETS: ${{ inputs.presets || 'quick' }}
        run: |
          sleep 20  # allow a just-published Pages deployment to propagate
          npm run test:smoke -- "$SITE_URL"
      - name: Probe national data sources from the browser
        if: always()
        timeout-minutes: 5
        env:
          SITE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:8000/' || inputs.site_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: npm run test:sources -- "$SITE_URL"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-screenshots
          path: smoke*.png
