name: Build terrain and publish viewer

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all_presets:
        description: "Live check: build all 58 presets (about 15 minutes longer)"
        type: boolean
        default: true
  schedule:
    # refresh Google Flood Hub forecasts every three hours
    - cron: "17 */3 * * *"
    # nightly full live check of every preset (2:43 am Brisbane time)
    - cron: "43 16 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Cache Rust builds
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ hashFiles('rust-toolchain.toml', 'rust/**/*.rs', 'rust/**/Cargo.toml', 'rust/Cargo.lock') }}
          restore-keys: rust-

      # The flood model in Rust: its own tests, then compiled to WebAssembly
      # for the browser and checked against the Rust reference numbers
      # (tests/parity.js) — the wasm bridge can't change the numbers.
      - name: Build and test the Rust flood model
        working-directory: rust
        run: |
          rustup target add wasm32-unknown-unknown
          cargo test --locked --release --workspace   # the model, its WebAssembly interface and the pipeline
          cargo build --locked --release -p flood-wasm --target wasm32-unknown-unknown
          cargo build --locked --release -p flood-pipeline
          echo "$PWD/target/release" >> "$GITHUB_PATH"
          cp target/wasm32-unknown-unknown/release/flood_wasm.wasm ../work-flood.wasm
          echo "::notice::flood.wasm: $(wc -c < ../work-flood.wasm) bytes"

      - name: Test the WebAssembly model
        env:
          FLOOD_IMPL: wasm
          FLOOD_WASM: work-flood.wasm
        run: |
          node --test tests/*.test.js
          node tests/parity.js > work-parity-wasm.txt
          (cd rust && cargo run -q --release -p flood-core --example parity) > work-parity-rust.txt
          FLOOD_IMPL=wasm node tests/parity.js work-parity-rust.txt

      # Terrain only needs rebuilding when the area or the pipeline changes.
      - name: Restore built terrain
        id: terrain
        uses: actions/cache@v6
        with:
          path: |
            work/brisbane/*.tif
            work/brisbane/hydrology.json
          key: terrain-${{ hashFiles('config/brisbane.json', 'rust/flood-pipeline/src/dem.rs', 'rust/flood-pipeline/src/geo.rs', 'rust/flood-pipeline/src/hydrology.rs', 'rust/flood-pipeline/Cargo.toml', 'rust/Cargo.lock') }}

      - name: Cache DEM tiles
        if: steps.terrain.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: work/brisbane/tiles
          key: glo30-${{ hashFiles('config/brisbane.json') }}

      - name: Fetch DEM (Copernicus GLO-30)
        id: dem
        if: steps.terrain.outputs.cache-hit != 'true'
        continue-on-error: true
        run: flood dem config/brisbane.json work/brisbane

      - name: Run hydrology inside flood
        id: hydro
        if: steps.terrain.outputs.cache-hit != 'true' && steps.dem.outcome == 'success'
        continue-on-error: true
        run: flood hydrology config/brisbane.json work/brisbane

      - name: Assemble site
        env:
          # the live data broker (broker/README.md); a repository variable
          FLOOD_BROKER_URL: ${{ vars.FLOOD_BROKER_URL }}
        run: |
          mkdir -p site/data
          npm run build
          if [ -f work/brisbane/dem.tif ] && [ -f work/brisbane/d8.tif ]; then
            flood export config/brisbane.json work/brisbane site/data
          else
            echo "::warning::Brisbane terrain was not built; the site will show the sample terrain only."
            rm -f work/brisbane/*.tif  # never cache a partial build
          fi

      - name: Fetch national BoM gauges, dams and readings
        id: national
        continue-on-error: true
        run: flood national site/data/national | tee national.log

      - name: Month for the monthly caches
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # Hour-by-hour readings for recorded floods: fetched once per change to
      # the event list (they don't change), then kept in the cache
      - name: Restore recorded flood readings
        id: events
        uses: actions/cache@v6
        with:
          path: cache/events.json
          key: events-${{ hashFiles('config/events.json', 'rust/flood-pipeline/src/events.rs') }}

      - name: Fetch recorded flood readings (Water Data Online)
        if: steps.events.outputs.cache-hit != 'true' && steps.national.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          mkdir -p cache
          flood events config/events.json site/data/national/gauges.geojson cache/events.json | tee events.log

      # Recorded sea levels for those floods (tide gauges): slow downloads,
      # so their own step, cache and time limit
      - name: Restore recorded sea levels
        id: sea
        uses: actions/cache@v6
        with:
          path: cache/sea.json
          key: sea-${{ hashFiles('config/events.json', 'rust/flood-pipeline/src/events.rs', 'rust/flood-pipeline/src/sealevels.rs') }}

      - name: Fetch recorded sea levels (UHSLC, Maritime Safety Queensland)
        if: steps.sea.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 25
        run: |
          [ -f cache/events.json ] && flood sealevels cache/events.json cache/sea.json | tee sea.log || true

      - name: Restore levee lines
        id: levees
        uses: actions/cache@v6
        with:
          path: cache/levees.geojson
          key: levees-${{ steps.month.outputs.month }}-${{ hashFiles('rust/flood-pipeline/src/levees.rs') }}

      - name: Fetch levee lines (NSW levee audit, Victorian coastal levees; monthly)
        if: steps.levees.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          mkdir -p cache
          flood levees cache/levees.geojson | tee levees.log

      # OpenStreetMap buildings, roads and key sites for the presets, so
      # impact counts don't depend on the busy Overpass service. Each run
      # refreshes a few (missing first, then over 30 days old); the cache
      # always restores the latest set.
      # Level-to-flow ratings for gauges near the presets, fitted to ten
      # years of daily records (monthly)
      - name: Restore gauge ratings
        id: ratings
        uses: actions/cache@v6
        with:
          path: cache/ratings.json
          key: ratings-${{ steps.month.outputs.month }}-${{ hashFiles('rust/flood-pipeline/src/ratings.rs') }}

      - name: Fit gauge ratings from Water Data Online (monthly)
        if: steps.ratings.outputs.cache-hit != 'true' && steps.national.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 40
        run: |
          flood ratings viewer/app.js site/data/national/gauges.geojson cache/ratings.json | tee ratings.log

      # Workers by place of work per SA2 (ABS 2021 Census); fixed data, so
      # fetched once per change to the script
      - name: Restore worker counts
        id: workers
        uses: actions/cache@v6
        with:
          path: cache/workers.json
          key: workers-${{ hashFiles('rust/flood-pipeline/src/workers.rs') }}

      - name: Fetch workers by place of work (ABS 2021 Census)
        if: steps.workers.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          flood workers cache/workers.json | tee workers.log
          grep -q '^Workers: [0-9]' workers.log || rm -f cache/workers.json

      # Tide heights around the whole coast (AIMS EOT20 tidal statistics);
      # they don't change, so fetched once per change to the script
      - name: Restore tide heights
        id: tides
        uses: actions/cache@v6
        with:
          path: cache/tides.json
          key: tides-${{ hashFiles('rust/flood-pipeline/src/tides.rs') }}

      - name: Fetch tide heights for the whole coast
        if: steps.tides.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          flood tides cache/tides.json | tee tides.log
          grep -q '^Tides: [0-9]' tides.log || rm -f cache/tides.json

      - name: Restore OpenStreetMap copies
        uses: actions/cache@v6
        with:
          path: cache/osm
          key: osm-${{ github.run_id }}
          restore-keys: osm-

      - name: Refresh OpenStreetMap copies for the presets (a few per run)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          flood osm viewer/app.js cache/osm --max 12 --days 30 | tee osm.log

      - name: Publish recorded floods and levees
        run: |
          [ -f cache/events.json ] && flood sealevels merge cache/events.json cache/sea.json site/data/events.json || true
          [ -f cache/levees.geojson ] && cp cache/levees.geojson site/data/levees.geojson || true
          [ -f cache/tides.json ] && cp cache/tides.json site/data/tides.json || true
          [ -f cache/ratings.json ] && cp cache/ratings.json site/data/ratings.json || true
          [ -f cache/workers.json ] && cp cache/workers.json site/data/workers.json || true
          echo "::notice::$(grep -E '^Workers' workers.log 2>/dev/null || ([ -f cache/workers.json ] && echo 'Workers: from cache') || echo 'Workers: none')"
          echo "::notice::$(grep -E '^Ratings' ratings.log 2>/dev/null || echo 'Ratings: from cache')"
          echo "::notice::$(grep -E '^Tides' tides.log 2>/dev/null || ([ -f cache/tides.json ] && echo 'Tides: from cache') || echo 'Tides: none')"
          if [ -f cache/osm/index.json ]; then mkdir -p site/data/osm && cp cache/osm/*.json site/data/osm/; fi
          echo "::notice::$(grep -E '^OpenStreetMap copies' osm.log 2>/dev/null || echo 'OpenStreetMap copies: none')"
          grep '^warning:' osm.log 2>/dev/null | head -3 | sed 's/^warning:/::warning::OpenStreetMap copy /' || true
          echo "::notice::$(grep -E '^Recorded floods' events.log 2>/dev/null || echo 'Recorded floods: from cache')"
          echo "::notice::$(grep -E '^Sea levels' sea.log 2>/dev/null || ([ -f cache/sea.json ] && echo 'Sea levels: from cache') || echo 'Sea levels: none')"
          grep -E '^(note|warning): ' sea.log 2>/dev/null | head -6 | cut -c1-700 | sed -E 's/^(note|warning): /::notice::Sea level /' || true
          grep -E '^Other gauges' events.log 2>/dev/null | cut -c1-900 | sed 's/^/::notice::/' || true
          grep '^warning:' events.log 2>/dev/null | head -4 | sed 's/^warning:/::warning::Recorded flood /' || true
          echo "::notice::$(grep -E '^Levees' levees.log 2>/dev/null || echo 'Levees: from cache')"

      - name: Fetch BoM flood class levels and current flood warnings
        id: floodinfo
        continue-on-error: true
        timeout-minutes: 5
        run: flood floodinfo site/data/national | tee floodinfo.log

      # Dam water history builds up across runs: restore the latest copy,
      # spend at most ~5 minutes filling in or refreshing dams, save again.
      - name: Restore dam water history
        uses: actions/cache/restore@v6
        with:
          path: cache/waterhistory.json
          key: waterhistory-${{ github.run_id }}
          restore-keys: waterhistory-

      - name: Fetch dam water history (time-limited)
        id: whfetch
        if: steps.national.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        env:
          WATERHISTORY_BUDGET_S: "300"
        run: |
          flood waterhistory site/data/national cache/waterhistory.json | tee wh.log
          mkdir -p cache && cp site/data/national/waterhistory.json cache/waterhistory.json

      - name: Save dam water history
        if: always() && hashFiles('cache/waterhistory.json') != ''
        uses: actions/cache/save@v6
        with:
          path: cache/waterhistory.json
          key: waterhistory-${{ github.run_id }}

      - name: Publish previous water history if this run fetched none
        if: steps.whfetch.outcome != 'success' && hashFiles('cache/waterhistory.json') != ''
        run: cp cache/waterhistory.json site/data/national/waterhistory.json

      - name: Restore council flood images
        id: council
        uses: actions/cache@v6
        with:
          path: cache/council
          key: council-${{ steps.month.outputs.month }}-${{ hashFiles('rust/flood-pipeline/src/council.rs') }}

      - name: Render council flood images (monthly)
        if: steps.council.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          flood council cache/council | tee council.log
          jq -e '.layers | length == 2' cache/council/council.json > /dev/null || rm -rf cache/council

      - name: Publish council flood images
        run: |
          if [ -f cache/council/council.json ]; then mkdir -p site/data/council && cp cache/council/* site/data/council/; fi
          echo "::notice::Council images: $(grep -E '^(creek|overland):|^warning' council.log 2>/dev/null | tr '\n' ' ' || echo 'from cache')"

      - name: Restore DEA national images
        id: dea
        uses: actions/cache@v6
        with:
          path: cache/dea
          key: dea-${{ steps.month.outputs.month }}-${{ hashFiles('rust/flood-pipeline/src/dea.rs') }}

      - name: Stitch DEA national images (monthly)
        if: steps.dea.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 15
        run: flood dea cache/dea | tee dea.log || rm -rf cache/dea

      - name: Publish DEA national images
        run: |
          if [ -f cache/dea/dea.json ]; then mkdir -p site/data/dea && cp cache/dea/* site/data/dea/; fi
          echo "::notice::$(grep -E '^DEA mosaic' dea.log 2>/dev/null || echo 'DEA mosaic: from cache')"

      - name: Fetch Google Flood Hub forecasts
        id: floodhub
        continue-on-error: true
        env:
          FLOOD_FORECASTING_API_KEY: ${{ secrets.FLOOD_FORECASTING_API_KEY }}
        run: flood floodhub config/brisbane.json site/data | tee floodhub.log

      - name: Data status for the app
        run: flood status site national.log floodinfo.log events.log sea.log ratings.log tides.log workers.log osm.log levees.log floodhub.log

      - name: Build summary
        run: |
          {
            echo "### Build summary"
            echo "- Terrain from cache: ${{ steps.terrain.outputs.cache-hit || 'false' }}"
            echo "- DEM download: ${{ steps.dem.outcome || 'skipped' }}"
            echo "- In-process hydrology: ${{ steps.hydro.outcome || 'skipped' }}"
            echo "- National BoM data: ${{ steps.national.outcome }} — $(grep '^National' national.log 2>/dev/null)"
            echo "- Flood Hub: ${{ steps.floodhub.outcome }} — $(tail -n1 floodhub.log 2>/dev/null)"
            du -sh site/data/* 2>/dev/null | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::$(tail -n1 floodhub.log 2>/dev/null)"
          echo "::notice::$(grep '^National' national.log 2>/dev/null)"
          echo "::notice::$(grep '^Flood info' floodinfo.log 2>/dev/null || echo 'Flood info: not fetched')"
          grep '^warning:' floodinfo.log 2>/dev/null | head -2 | sed 's/^warning:/::warning::Flood info: /' || true
          echo "::notice::$(grep '^Water history' wh.log 2>/dev/null || echo 'Water history: not fetched this run')"
          grep '^warning:' wh.log 2>/dev/null | head -2 | sed 's/^warning:/::warning::Water history: /' || true
          grep '^warning:' national.log 2>/dev/null | head -3 | sed 's/^warning:/::warning::National data: /' || true

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke-test:
    needs: deploy
    uses: ./.github/workflows/browser-tests.yml
    with:
      site_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      presets: ${{ ((github.event_name == 'schedule' && github.event.schedule == '43 16 * * *') || (github.event_name == 'workflow_dispatch' && inputs.all_presets)) && 'all' || 'quick' }}
