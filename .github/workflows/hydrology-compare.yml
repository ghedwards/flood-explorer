name: Compare in-process hydrology with GeoLibre

# Runs the Brisbane hydrology twice on the same dem.tif: with the separate
# geolibre program (tests/geolibre/run_hydrology.sh) and inside flood (`flood
# hydrology`), and compares every raster cell by cell.
on:
  push:
    branches: [hydrology-inprocess]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-hydro-${{ hashFiles('rust-toolchain.toml', 'rust/**/*.rs', 'rust/**/Cargo.toml', 'rust/Cargo.lock') }}
          restore-keys: rust-hydro-
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the WebAssembly model
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --locked --release --manifest-path rust/Cargo.toml -p flood-wasm --target wasm32-unknown-unknown
      - name: Test the viewer against the wasm model
        run: |
          export FLOOD_WASM="$PWD/rust/target/wasm32-unknown-unknown/release/flood_wasm.wasm"
          node --test tests/*.test.js
      - name: Build and test flood
        working-directory: rust
        run: |
          cargo test --locked --release --workspace 2> test.log || { grep -E "^error|panicked|FAILED" -A3 test.log | head -20 | sed 's/^/::error::/'; exit 1; }
          cargo build --locked --release -p flood-pipeline
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: Build and test WebAssembly parity
        run: |
          export FLOOD_WASM="$PWD/rust/target/wasm32-unknown-unknown/release/flood_wasm.wasm"
          FLOOD_IMPL=wasm node --test tests/core.test.js
          node tests/parity.js > work-parity-wasm.txt
          cargo run --locked -q --release --manifest-path rust/Cargo.toml -p flood-core --example parity > work-parity-rust.txt
          FLOOD_IMPL=wasm node tests/parity.js work-parity-rust.txt
      - name: GeoLibre runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tests/geolibre/install_geolibre.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Hydrology both ways
        run: |
          flood dem config/brisbane.json work/a
          mkdir -p work/b && cp work/a/dem.tif work/b/
          s=$(date +%s); tests/geolibre/run_hydrology.sh config/brisbane.json work/a > a.log; ta=$(( $(date +%s) - s ))
          s=$(date +%s); flood hydrology config/brisbane.json work/b > b.log; tb=$(( $(date +%s) - s ))
          echo "::notice::geolibre program: ${ta} s; in flood: ${tb} s ($(tail -1 b.log))"
      - name: Compare
        run: flood compare-hydrology work/a work/b
      - name: Export from the in-process run
        run: |
          flood export config/brisbane.json work/b site/data
          node -e "const m = require('./site/data/brisbane/meta.json'); console.log('::notice::processedWith:', m.processedWith, '| gauge', m.gauge)"
