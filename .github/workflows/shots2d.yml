name: 2D map screenshots

# Screenshots of the 2D map (tests/shots2d.js) pushed to the shots-2d
# branch, for reviewing it without a browser at hand. Runs against the
# live site, or against a 2d-* branch built here.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "live, or build (this branch, built and served here)"
        default: live
      place:
        description: "Preset to model"
        default: rockhampton
  push:
    branches: ["2d-*"]

permissions:
  contents: write

concurrency:
  group: shots2d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox
      - name: Build and serve this branch
        if: github.event_name == 'push' || inputs.target == 'build'
        run: |
          npm run build
          npm run preview -- --port 8000 --strictPort > preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat preview.log
          exit 1
      - name: Screenshots
        env:
          SITE_URL: ${{ (github.event_name == 'push' || inputs.target == 'build') && 'http://127.0.0.1:8000/' || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          PLACE: ${{ inputs.place || 'rockhampton' }}
          OUT: ${{ runner.temp }}/shots
        run: node tests/shots2d.js
      - name: Dam model check (Lake Kurwongbah), live site and this build
        if: github.event_name == 'push' || inputs.target == 'build'
        continue-on-error: true
        env:
          OUT: ${{ runner.temp }}/shots
        run: |
          SITE_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ TAG=dam-live node tests/dam-check.js || true
          SITE_URL=http://127.0.0.1:8000/ TAG=dam-build node tests/dam-check.js
      - name: River below the gauge across preset towns
        if: github.event_name == 'push' || inputs.target == 'build'
        continue-on-error: true
        env:
          SITE_URL: http://127.0.0.1:8000/
          OUT: ${{ runner.temp }}/shots
        run: node tests/downstream-check.js
      - name: Service worker tile cache (Chromium and Firefox)
        if: github.event_name == 'push' || inputs.target == 'build'
        env:
          SITE_URL: http://127.0.0.1:8000/
          OUT: ${{ runner.temp }}/shots
        run: node tests/sw-tiles.js
      - name: Push to the shots-2d branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/shots" || exit 0
          printf '%s\n' "From ${GITHUB_REF_NAME} at ${GITHUB_SHA::8} (${{ github.event_name }}), $(date -u +%FT%TZ)" > SOURCE.txt
          git init -q -b shots-2d
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "2D screenshots for ${GITHUB_REF_NAME} ${GITHUB_SHA::8}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" shots-2d
