name: Live data broker check
# What the deployed broker answers: /health, /v1/readings and /v1/levels,
# as notices on the run.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Broker URL (default: the FLOOD_BROKER_URL variable)"
        required: false
  schedule:
    - cron: "37 */6 * * *"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ask the broker
        env:
          URL: ${{ inputs.url || vars.FLOOD_BROKER_URL }}
        run: |
          set +e
          if [ -z "$URL" ]; then echo "::warning title=No broker URL::set FLOOD_BROKER_URL or pass url"; exit 0; fi
          URL="${URL%/}"
          for p in /health "/v1/readings" "/v1/levels?sites=143001C"; do
            code=$(curl -s -m 60 -o out.json -w '%{http_code}' -H "Origin: https://ghedwards.github.io" -D h.txt "$URL$p")
            size=$(wc -c < out.json)
            age=$(grep -i '^x-readings-age' h.txt | tr -d '\r' | cut -d' ' -f2)
            summary=$(python3 - <<'PY'
          import json
          try:
              d = json.load(open('out.json'))
          except Exception as e:
              print(open('out.json', errors='replace').read()[:300].replace('\n', ' ')); raise SystemExit
          if 'level' in d:
              lv = d.get('level', {})
              print('fetched', d.get('fetched'), '| levels', len(lv), '| storages', len(d.get('storage', {})),
                    '| live Qld', sum(1 for v in lv.values() if v.get('latestKind') == 'realtime'), '| errors', (d.get('errors') or [])[:3])
          else:
              print(json.dumps(d)[:400])
          PY
          )
            echo "::notice title=$p HTTP $code ($size bytes${age:+, age ${age}s})::$summary"
          done
      - name: Compression and revalidation
        env:
          URL: ${{ inputs.url || vars.FLOOD_BROKER_URL }}
        run: |
          set +e
          [ -z "$URL" ] && exit 0
          URL="${URL%/}"
          code=$(curl -s -m 60 --compressed -o r.json -D h.txt -w '%{http_code} %{size_download}' -H "Origin: https://ghedwards.github.io" "$URL/v1/readings")
          enc=$(grep -i '^content-encoding' h.txt | tr -d '\r' | cut -d' ' -f2); etag=$(grep -i '^etag' h.txt | tr -d '\r' | cut -d' ' -f2-)
          cc=$(grep -i '^cache-control' h.txt | tr -d '\r' | cut -d' ' -f2-)
          again=$(curl -s -m 60 -o /dev/null -w '%{http_code} %{size_download}' -H "If-None-Match: $etag" -H "Accept-Encoding: gzip" "$URL/v1/readings")
          valid=$(python3 -c "import json;d=json.load(open('r.json'));print(len(d.get('level',{})),'levels')" 2>&1)
          echo "::notice title=Readings transfer::HTTP/bytes on the wire $code, encoding ${enc:-none}, $valid, cache-control '$cc', revalidation with ETag: $again"
      - name: The live site's readings source
        run: |
          set +e
          npm init -y > /dev/null && npm i --silent playwright@1 > /dev/null 2>&1 && npx playwright install chromium > /dev/null 2>&1
          cat > site.js <<'JS'
          const { chromium } = require("playwright");
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage();
            await p.goto("https://ghedwards.github.io/flood-explorer/", { waitUntil: "load", timeout: 90000 });
            await p.waitForFunction("window.__floodStatus && window.__floodStatus.national && window.__floodStatus.national.loaded", null, { timeout: 90000 });
            const n = await p.evaluate(() => window.__floodStatus.national);
            console.log(`::notice title=Live site readings::dataSource=${n.dataSource} readingsSource=${n.readingsSource} fetched=${n.readingsFetched} levels=${n.levelReadings} storages=${n.storageReadings}`);
            await b.close();
          })().catch((e) => { console.log(`::warning title=Live site check failed::${String(e).slice(0, 300)}`); });
          JS
          node site.js
