name: Probe data sources
# temporary: what the Bureau's anonymous FTP server publishes for flood warnings
on:
  push:
    branches: ["probe-*"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: List the warnings folder
        run: |
          set +e
          curl -sS -m 120 --list-only ftp://ftp.bom.gov.au/anon/gen/fwo/ -o list.txt
          echo "::notice title=fwo files::$(wc -l < list.txt) files; $(head -c 300 list.txt | tr '\n' ' ')"
          for st in Q N V S T W D; do
            echo "::notice title=ID${st}2 (warnings?)::$(grep -E "^ID${st}2[0-9]{4}\." list.txt | sort | head -60 | tr '\n' ' ')"
          done
          echo "::notice title=IDZ::$(grep -E '^IDZ' list.txt | head -40 | tr '\n' ' ')"
      - name: Sample Queensland flood warning files
        run: |
          set +e
          curl -sS -m 120 --list-only ftp://ftp.bom.gov.au/anon/gen/fwo/ -o list.txt
          for f in $(grep -E '^IDQ20[0-9]{3}\.(xml|txt)$' list.txt | head -6); do
            curl -sS -m 60 "ftp://ftp.bom.gov.au/anon/gen/fwo/$f" -o f.bin
            echo "::notice title=$f::$(wc -c < f.bin) bytes: $(head -c 600 f.bin | tr '\n\r' '  ')"
          done
