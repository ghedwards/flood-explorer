name: Probe data sources
# temporary: what cargo audit reports for main's Cargo.lock
on:
  push:
    branches: ["probe-*"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { ref: main }
      - name: cargo audit
        run: |
          set +e
          cargo install cargo-audit --locked --quiet 2>/dev/null
          cargo audit --file rust/Cargo.lock --json > audit.json
          python3 - <<'PY'
          import json
          d = json.load(open('audit.json'))
          for v in d.get('vulnerabilities', {}).get('list', []):
              a = v['advisory']; p = v['package']
              print(f"::notice title={a['id']} {p['name']} {p['version']}::{a['title']} | patched: {v.get('versions', {}).get('patched')} | {a.get('url') or ''}")
          for kind, lst in (d.get('warnings') or {}).items():
              for w in lst[:10]:
                  a = w.get('advisory') or {}; p = w.get('package') or {}
                  print(f"::notice title=warning {kind} {p.get('name')} {p.get('version')}::{a.get('id')} {a.get('title')}")
          print("::notice title=summary::vulnerabilities", d.get('vulnerabilities', {}).get('count'))
          PY
          cargo tree --manifest-path rust/Cargo.toml -i $(python3 -c "import json;d=json.load(open('audit.json'));l=d.get('vulnerabilities',{}).get('list',[]);print(l[0]['package']['name'] if l else 'serde')") --depth 4 2>/dev/null | head -30 | tr '\n' ' ' | sed 's/^/::notice title=who uses it::/'
