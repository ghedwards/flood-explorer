name: Probe data sources
# temporary: which Bureau FTP products carry gauges' flood class levels
on:
  push:
    branches: ["probe-*"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Look for flood class levels in river products
        run: |
          set +e
          B=ftp://ftp.bom.gov.au/anon/gen/fwo
          curl -sS -m 120 --list-only "$B/" -o list.txt
          for st in Q N V S T W D; do
            echo "::notice title=ID${st}6 products::$(grep -E "^ID${st}6[0-9]{4}" list.txt | sed 's/\..*//' | sort -u | head -40 | tr '\n' ' ')"
          done
          # river height bulletins and similar: which mention flood class levels?
          for f in $(grep -E '^ID[QNV]6[0-9]{4}\.(txt|html)$' list.txt | head -40); do
            curl -sS -m 30 "$B/$f" -o f.bin
            hits=$(grep -ci 'minor\|moderate\|major\|flood class' f.bin)
            title=$(grep -m1 -i 'bulletin\|river height\|flood' f.bin | tr -s ' ' | head -c 150)
            echo "::notice title=$f ($(wc -c < f.bin) bytes, $hits class words)::$title"
          done
      - name: Sample one that has class levels
        run: |
          set +e
          B=ftp://ftp.bom.gov.au/anon/gen/fwo
          curl -sS -m 120 --list-only "$B/" -o list.txt
          for f in $(grep -E '^IDQ6[0-9]{4}\.(txt|html)$' list.txt | head -60); do
            curl -sS -m 30 "$B/$f" -o f.bin
            if grep -qi 'moderate' f.bin && grep -qi 'major' f.bin; then
              echo "::notice title=sample $f::$(head -c 2500 f.bin | tr '\n\r\t' '   ')"
              break
            fi
          done
