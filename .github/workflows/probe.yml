name: Probe data sources
# temporary: how to pick out flood warnings on the Bureau's FTP server
on:
  push:
    branches: ["probe-*"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Index files and a CAP warning
        run: |
          set +e
          B=ftp://ftp.bom.gov.au/anon/gen/fwo
          for f in IDZ00107.xml IDZ00110.xml; do
            curl -sS -m 60 "$B/$f" -o f.bin; echo "::notice title=$f::$(wc -c < f.bin) bytes: $(head -c 1500 f.bin | tr '\n\r\t' '   ')"
          done
          curl -sS -m 60 "$B/IDQ20860.cap.xml" -o c.xml; echo "::notice title=IDQ20860.cap.xml::$(wc -c < c.xml) bytes: $(head -c 2500 c.xml | tr '\n\r\t' '   ')"
          curl -sS -m 60 "$B/IDQ20860.xml" -o x.xml
          python3 - <<'PY'
          import re
          t = open('x.xml', errors='replace').read()
          for tag in ['product-type', 'service', 'phenomenon', 'issue-time-utc', 'expiry-time', 'next-routine-issue-time-utc', 'status']:
              m = re.search(r'<%s[^>]*>(.*?)</%s>' % (tag, tag), t, re.S)
              print(f"::notice title=amoc {tag}::{m.group(1).strip()[:200] if m else None}")
          print("::notice title=areas::" + " | ".join(re.findall(r'<area[^>]*description="([^"]+)"', t)[:12]))
          print("::notice title=element types::" + " ".join(sorted(set(re.findall(r'<(?:element|text)[^>]*type="([^"]+)"', t)))[:40]))
          print("::notice title=forecast-ish::" + " | ".join(re.findall(r'type="(?:forecast_[a-z_]+|river_height[a-z_]*)"[^>]*>([^<]{0,120})', t)[:8]))
          PY
          curl -sS -m 120 --list-only "$B/" -o list.txt
          echo "::notice title=amoc product types (sample of 40 ID?2/3 xml)::$(for f in $(grep -E '^ID[NQVSTWD][23][0-9]{4}\.xml$' list.txt | head -40); do curl -sS -m 20 "$B/$f" | grep -o '<product-type>[^<]*</product-type>\|<service>[^<]*</service>' | tr '\n' ' '; echo -n "$f; "; done)"
