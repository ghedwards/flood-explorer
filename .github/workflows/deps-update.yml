name: Update TLS certificate crates (temporary)
# RUSTSEC-2026-0381/0382: rustls-webpki >= 0.103.16, webpki-roots >= 1.0.10
on:
  push:
    branches: ["deps-*"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Update the lockfile
        run: |
          cd rust
          cargo update -p rustls-webpki
          cargo update -p webpki-roots@1.0.9 || cargo update -p webpki-roots
          git diff --stat
          git diff Cargo.lock | grep -E '^[-+](name|version)' | head -20 | tr '\n' ' ' | sed 's/^/::notice title=lock changes::/'
      - name: Audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --quiet
          cargo audit --file rust/Cargo.lock 2>&1 | grep -E 'ID:|Crate:|Version:|error|warning: [0-9]' | tr '\n' ' ' | sed 's/^/::notice title=audit after::/'; true
      - name: Commit back to this branch
        run: |
          git config user.name "Gareth Edwards"; git config user.email ghedwards@users.noreply.github.com
          git rm -q --cached .github/workflows/deps-update.yml && rm .github/workflows/deps-update.yml
          git add rust/Cargo.lock
          git commit -q -m "Update rustls-webpki and webpki-roots (RUSTSEC-2026-0381, RUSTSEC-2026-0382)

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01HcSweov2vANXB3zE77VQ2Q" && git push -q origin HEAD:${GITHUB_REF_NAME}
