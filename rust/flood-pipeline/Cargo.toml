[package]
name = "flood-pipeline"
version = "0.1.0"
edition = "2021"
description = "Flood Explorer's data pipeline: fetches gauges, floods, sea levels, levees, tides and more, and builds the terrain for the site."
license = "MIT"
publish = false

[[bin]]
name = "flood"
path = "src/main.rs"

[dependencies]
ureq = "3.4"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tiff = "0.11"
png = "0.18"
miniz_oxide = "0.9"
regex = "1"
# The RustGIS / GeoLibre hydrology tools (whitebox_next_gen), pinned to the
# upstream revision. Not on crates.io (publish = false).
wbcore = { git = "https://github.com/opengeos/whitebox-wasm", rev = "f0076c2383ebd9248454b32f13cd002fa27f21b0" }
wbtools_oss = { git = "https://github.com/opengeos/whitebox-wasm", rev = "f0076c2383ebd9248454b32f13cd002fa27f21b0" }

# Workspace sibling: flood-core's flood model is included in parity checks.
flood-core = { path = "../flood-core" }
