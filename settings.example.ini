# Copy to settings.ini (ignored) for the standalone broker, or to
# ~/.flood-explorer/settings.ini for desktop. No quotes around values.
# Override with --settings PATH (broker) or FLOOD_SETTINGS (broker/desktop).
# Non-empty environment variables take precedence over file values.

# Shared broker/desktop feed credentials.
# Blank QLD uses the built-in shared key; blank NSW skips that feed.
QLD_TRAFFIC_API_KEY=
NSW_TRAFFIC_API_KEY=

# Standalone broker options. Desktop sets its own host/port/data defaults.
HOST=127.0.0.1
PORT=8787
ALLOWED_ORIGINS=http://127.0.0.1:8000
CACHE_MINUTES=10
READINGS_REFRESH_MINUTES=15
FLOOD_STORAGE=local
# Optional absolute directory for cached readings:
FLOOD_DATA_DIR=

# Google forecasting and release signing are environment/Actions settings,
# not supported settings.ini keys. See docs/services-and-credentials.md.
