[package]
name = "flood-explorer-desktop"
version = "0.1.0"
edition = "2021"
description = "Flood Explorer desktop (Tauri) shell"
license = "MIT"

[lib]
name = "flood_explorer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
